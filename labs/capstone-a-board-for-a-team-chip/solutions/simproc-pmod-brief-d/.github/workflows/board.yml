# Checks the board and builds its fabrication files and review images on every push and pull
# request. Every step runs ci/build.sh in the KiCad image named in ci/kicad-image.txt, by
# digest, so CI runs the same KiCad as the PCB101 checks on your own machine.
name: Board

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Pull the pinned KiCad image
        run: |
          image="$(head -n 1 ci/kicad-image.txt)"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          docker pull "$image"

      # Each step runs one stage of ci/build.sh in a fresh container, as the runner's own uid,
      # with the repository at /work. If a stage fails, the later ones are skipped.
      - name: ERC, DRC and schematic parity
        run: docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/home -e PCB101_KICAD_IMAGE="$IMAGE" -v "$PWD:/work" -w /work "$IMAGE" bash ci/build.sh check

      - name: Fabrication files
        run: docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/home -v "$PWD:/work" -w /work "$IMAGE" bash ci/build.sh fab

      - name: Review images
        run: docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/home -v "$PWD:/work" -w /work "$IMAGE" bash ci/build.sh images

      # Runs even when a check failed, so a red run still has its ERC and DRC reports.
      - name: Upload the outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: board-outputs
          path: out/
          if-no-files-found: ignore
